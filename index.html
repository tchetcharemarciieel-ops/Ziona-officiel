<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique J</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}

header {
  background:#000;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header span {
  cursor:pointer;
}

.cart-icon {
  font-size:20px;
}

.container {
  padding:20px;
}

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product {
  background:#fff;
  border-radius:10px;
  padding:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  cursor:pointer;
}

.product img {
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:8px;
}

.price {
  font-weight:bold;
}

button {
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  background:#000;
  color:#fff;
  cursor:pointer;
  border-radius:5px;
}

.cart {
  background:#fff;
  padding:15px;
  margin-top:25px;
  border-radius:10px;
}

.cart-item {
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.total {
  font-size:18px;
  font-weight:bold;
}

.whatsapp {
  background:#25D366;
  margin-top:10px;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<header>
  <span onclick="showHome()">☰ Menu</span>
  <strong>Boutique J</strong>
  <span class="cart-icon">🛒 <span id="count">0</span></span>
</header>

<div class="container">

<!-- PAGE ACCUEIL -->
<div id="home">
  <div class="products">
    <div class="product" onclick="openProduct(0)">
      <img src="https://via.placeholder.com/400">
      <h3>Casque Bluetooth</h3>
      <p class="price">15 000 XAF</p>
    </div>

    <div class="product" onclick="openProduct(1)">
      <img src="https://via.placeholder.com/400">
      <h3>Montre Connectée</h3>
      <p class="price">20 000 XAF</p>
    </div>

    <div class="product" onclick="openProduct(2)">
      <img src="https://via.placeholder.com/400">
      <h3>Écouteurs Sans Fil</h3>
      <p class="price">10 000 XAF</p>
    </div>
  </div>
</div>

<!-- PAGE PRODUIT -->
<div id="productPage" class="hidden">
  <h2 id="pname"></h2>
  <img id="pimg" style="width:100%;max-width:300px">
  <p id="pprice"></p>
  <button onclick="add()">Ajouter au panier</button>
  <button onclick="showHome()">⬅ Retour</button>
</div>

<!-- PANIER -->
<div class="cart">
  <h3>Panier</h3>
  <div id="cart"></div>
  <p>📍 Ville :
    <select id="city">
      <option>Bangui</option>
      <option>Bimbo</option>
      <option>Autre</option>
    </select>
  </p>
  <p>🚚 Livraison : 3–4 jours (frais possibles)</p>
  <div class="total">Total : <span id="total">0</span> XAF</div>
  <button class="whatsapp" onclick="pay()">Payer via WhatsApp</button>
</div>

</div>

<script>
const products = [
 {name:"Casque Bluetooth", price:15000, img:"https://via.placeholder.com/400"},
 {name:"Montre Connectée", price:20000, img:"https://via.placeholder.com/400"},
 {name:"Écouteurs Sans Fil", price:10000, img:"https://via.placeholder.com/400"}
];

let cart=[];
let current=null;

function openProduct(i){
  current=i;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("productPage").classList.remove("hidden");
  document.getElementById("pname").textContent=products[i].name;
  document.getElementById("pprice").textContent=products[i].price+" XAF";
  document.getElementById("pimg").src=products[i].img;
}

function showHome(){
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("productPage").classList.add("hidden");
}

function add(){
  let p=products[current];
  let item=cart.find(x=>x.name===p.name);
  if(item){item.qty++;}
  else{cart.push({name:p.name,price:p.price,qty:1});}
  render();
}

function render(){
  let c=document.getElementById("cart");
  c.innerHTML="";
  let total=0;
  let count=0;

  cart.forEach(p=>{
    total+=p.price*p.qty;
    count+=p.qty;
    c.innerHTML+=`<div class="cart-item">${p.name} x${p.qty}</div>`;
  });

  // Réduction LEVEL 1200
  if(total>=30000){ total*=0.9; }

  document.getElementById("total").textContent=Math.round(total);
  document.getElementById("count").textContent=count;
}

function pay(){
  if(cart.length===0){alert("Panier vide");return;}
  let msg="Commande Boutique J:%0A";
  let total=0;
  cart.forEach(p=>{
    msg+=`- ${p.name} x${p.qty}%0A`;
    total+=p.price*p.qty;
  });
  if(total>=30000){
    msg+="Réduction -10%% appliquée%0A";
    total*=0.9;
  }
  msg+=`Total: ${Math.round(total)} XAF`;
  window.open("https://wa.me/23672947165?text="+msg);
}
</script>

</body>
</html>
