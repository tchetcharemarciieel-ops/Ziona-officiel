<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique J Officiel</title>
<style>
body{margin:0;font-family:Arial;background:#fff;color:#000}
header{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:2px solid #000}
.menu-btn{font-size:26px;cursor:pointer}
.cart{font-size:22px;cursor:pointer}
.cart span{background:#000;color:#fff;border-radius:50%;padding:2px 7px;font-size:14px}
nav{display:none;border-bottom:2px solid #000;padding:10px}
nav button{display:block;width:100%;padding:12px;border:1px solid #000;margin:5px 0;background:#fff;cursor:pointer}
.section{padding:20px;display:none}
.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.card{border:1px solid #000;padding:15px;text-align:center}
.card button{margin-top:10px;padding:8px;background:#000;color:#fff;border:none;cursor:pointer}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #000}
footer{border-top:2px solid #000;padding:15px;text-align:center}
iframe{width:100%;height:700px;border:none}
</style>
</head>
<body>

<header>
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<strong>BOUTIQUE J OFFICIEL</strong>
<div class="cart" onclick="show('panier')">🛒 <span id="count">0</span></div>
</header>

<nav id="menu">
<button onclick="show('home')">Menu</button>
<button onclick="show('categories')">Catégories</button>
<button onclick="show('compte')">Mon compte</button>
<button onclick="show('contact')">Contact</button>
</nav>

<!-- Home -->
<div class="section active" id="home">
<h2>Commencer mon achat 🛒</h2>
</div>

<!-- Catégories -->
<div class="section" id="categories">
<h2>Catégories</h2>
<div class="grid">
<div class="card" onclick="load('T-shirt')">T-shirts</div>
<div class="card" onclick="load('Pull')">Pulls</div>
<div class="card" onclick="load('Chaussette')">Chaussettes</div>
</div>
</div>

<!-- Produits -->
<div class="section" id="products">
<h2 id="title"></h2>
<div class="grid" id="list"></div>
</div>

<!-- Panier -->
<div class="section" id="panier">
<h2>Panier</h2>
<div id="panierList"></div>
<h3>Total : <span id="total">0</span> FCFA</h3>
<p>🚚 Livraison : frais + 3–4 jours</p>
<button onclick="payer()">Payer via WhatsApp</button>
</div>

<!-- Mon compte -->
<div class="section" id="compte">
<h2>Créer un compte</h2>
<input id="clientNum" placeholder="Numéro (+236)">
<button onclick="alert('Compte créé avec succès !')">Valider</button>
<h3>Formulaire commande :</h3>
<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd1oDVXIW2XeunaBYHiJ60wb7TMip8dRdHzTxrJyW_WiVJLVA/viewform?embedded=true">Chargement…</iframe>
</div>

<!-- Contact -->
<div class="section" id="contact">
<h2>Contact</h2>
<p>📍 Bangui<br>
📞 72947165<br>
🕘 Lundi-Samedi : 09h00 – 19h00<br>Dimanche : Fermé</p>
</div>

<footer>© Boutique J</footer>

<script>
let cart=[],total=0;

function toggleMenu(){menu.style.display=menu.style.display=="block"?"none":"block"}
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');menu.style.display="none"}

function load(cat){
show('products');
title.innerText=cat;
list.innerHTML="";
for(let i=1;i<=5;i++){
list.innerHTML+=`
<div class="card">
${cat} ${i}<br>${(cat=="T-shirt"?5000:cat=="Pull"?10000:2000)} FCFA
<button onclick="add('${cat} ${i}',${cat=="T-shirt"?5000:cat=="Pull"?10000:2000})">Ajouter</button>
<div><small>Avis: ⭐⭐⭐⭐☆</small></div>
<div><small>Recommandation: Essayez ce produit !</small></div>
</div>`;
}}

function add(name,price){
cart.push({name,price});
total+=price;
count.innerText=cart.length;
updatePanier();
}

function updatePanier(){
panierList.innerHTML="";
cart.forEach(p=>panierList.innerHTML+=`<p>${p.name} - ${p.price} FCFA</p>`);
total.innerText=total;
}

function payer(){
let num=clientNum.value||"Non renseigné";
let msg="🛒 NOUVELLE COMMANDE\nClient: "+num+"\n";
cart.forEach(p=>msg+=p.name+" - "+p.price+" FCFA\n");
msg+="TOTAL: "+total+" FCFA";
alert("Merci pour votre commande 🙏");

// Ouvrir WhatsApp sur le numéro principal
window.open("https://wa.me/23672947165?text="+encodeURIComponent(msg),"_blank");
}
</script>

</body>
</html>
