<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique J Officiel</title>

<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#fff;color:#000}

/* HEADER */
header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 20px;
border-bottom:1px solid #000;
}
.logo{
font-weight:bold;
font-size:18px;
}
.slogan{
font-size:12px;
opacity:.7;
}
.icons{
display:flex;
gap:15px;
align-items:center;
cursor:pointer;
}
.cart{
position:relative;
font-size:22px;
}
.cart span{
position:absolute;
top:-8px;
right:-10px;
background:#000;
color:#fff;
font-size:12px;
padding:2px 6px;
border-radius:50%;
}

/* MENU */
.menu-btn{
font-size:22px;
cursor:pointer;
}
.menu{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#fff;
padding:30px;
z-index:10;
}
.menu h2{margin-top:0}
.menu button{
width:100%;
padding:15px;
margin:10px 0;
font-size:16px;
border:1px solid #000;
background:#000;
color:#fff;
cursor:pointer;
}

/* SECTIONS */
section{padding:20px;display:none}
.active{display:block}

/* INSCRIPTION */
input{
width:100%;
padding:15px;
margin:10px 0;
font-size:16px;
border:1px solid #000;
}
.btn{
padding:15px;
width:100%;
background:#000;
color:#fff;
border:none;
font-size:16px;
cursor:pointer;
}

/* CATEGORIES */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:15px;
}
.card{
border:1px solid #000;
padding:15px;
cursor:pointer;
text-align:center;
}

/* PRODUITS */
.product{
border:1px solid #000;
padding:15px;
}
.product button{
margin-top:10px;
width:100%;
}

/* AVIS */
.reviews{
font-size:12px;
margin-top:5px;
opacity:.8;
}

/* PANIER */
.cart-item{
display:flex;
justify-content:space-between;
margin:10px 0;
}

/* FOOTER */
footer{
padding:20px;
text-align:center;
font-size:12px;
border-top:1px solid #000;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<div class="menu-btn" onclick="openMenu()">☰</div>
<div>
<div class="logo">BOUTIQUE J OFFICIEL</div>
<div class="slogan">Never give up on your dreams</div>
</div>
<div class="icons">
<div onclick="showSection('account')">Mon compte</div>
<div class="cart" onclick="showSection('cart')">🛒<span id="cartCount">0</span></div>
</div>
</header>

<!-- MENU -->
<div class="menu" id="menu">
<h2>Menu</h2>
<button onclick="startShopping()">Commencer mon achat</button>
<button onclick="showSection('categories')">Catégories</button>
<button onclick="showSection('contact')">Contact</button>
<button onclick="closeMenu()">Fermer</button>
</div>

<!-- INSCRIPTION -->
<section id="signup" class="active">
<h2>Inscription rapide</h2>
<input id="phone" placeholder="+236 XXXXXXXX">
<button class="btn" onclick="register()">Entrer dans la boutique</button>
</section>

<!-- CATEGORIES -->
<section id="categories">
<h2>Catégories</h2>
<div class="grid">
<div class="card" onclick="openCategory('T-Shirts')">T-Shirts</div>
<div class="card" onclick="openCategory('Pulls')">Pulls</div>
<div class="card" onclick="openCategory('Chaussettes')">Chaussettes</div>
</div>
</section>

<!-- PRODUITS -->
<section id="products">
<h2 id="catTitle"></h2>
<div class="grid" id="productList"></div>
</section>

<!-- PANIER -->
<section id="cart">
<h2>Panier</h2>
<div id="cartItems"></div>
<button class="btn" onclick="checkout()">Payer via WhatsApp</button>
</section>

<!-- COMPTE -->
<section id="account">
<h2>Mon compte</h2>
<p>Numéro : <span id="userPhone"></span></p>
<p>Commandes : <span id="orders">0</span></p>
<button class="btn" onclick="showSection('cart')">Voir mon panier</button>
</section>

<!-- CONTACT -->
<section id="contact">
<h2>Contact</h2>
<p>📍 Bangui</p>
<p>🕘 Lun–Sam : 9h00 – 19h00</p>
<p>📞 +236 74370369<br>+236 72947165<br>+236 74648074</p>
</section>

<footer>
© 2026 Boutique J
</footer>

<script>
let cart=[];
let products={
"T-Shirts":["T-Shirt Classic","T-Shirt Premium","T-Shirt Street","T-Shirt Black","T-Shirt White"],
"Pulls":["Pull Basic","Pull Luxe","Pull Oversize","Pull Noir","Pull Blanc"],
"Chaussettes":["Chaussettes Classic","Chaussettes Sport","Chaussettes Luxe","Chaussettes Black","Chaussettes White"]
};

function openMenu(){document.getElementById("menu").style.display="block"}
function closeMenu(){document.getElementById("menu").style.display="none"}

function showSection(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
closeMenu();
}

function startShopping(){
showSection("categories");
}

function register(){
let phone=document.getElementById("phone").value;
if(phone.length<8){alert("Entrer un numéro valide");return;}
localStorage.setItem("user",phone);
document.getElementById("userPhone").innerText=phone;
showSection("categories");
}

function openCategory(cat){
document.getElementById("catTitle").innerText=cat;
let list=document.getElementById("productList");
list.innerHTML="";
products[cat].forEach(p=>{
list.innerHTML+=`
<div class="product">
<b>${p}</b>
<div class="reviews">⭐⭐⭐⭐⭐ (avis clients)</div>
<button class="btn" onclick="addCart('${p}')">Ajouter au panier</button>
</div>`;
});
showSection("products");
}

function addCart(p){
cart.push(p);
document.getElementById("cartCount").innerText=cart.length;
}

function checkout(){
if(cart.length===0){alert("Panier vide");return;}
alert("Merci de votre commande 🤍");
let msg="Commande Boutique J:%0A"+cart.join("%0A");
window.location.href="https://wa.me/23674370369?text="+msg;
}
</script>

</body>
</html>
