<script>
// ----------------- CLIENT -----------------
let client = JSON.parse(localStorage.getItem("clientZIONA"));
let pendingClient;
let codeGenerated;
let orders = JSON.parse(localStorage.getItem("ordersZIONA")) || [];

// Si client déjà connecté, on masque le modal
if(client){
    document.getElementById("authModal").style.display="none";
    console.log("Bienvenue de retour, "+client.name);
}

// Envoi code simulé
function sendCode(){
    const name = document.getElementById("clientName").value.trim();
    const phone = document.getElementById("clientPhone").value.trim();
    const city = document.getElementById("clientCity").value;
    if(!name || !phone || !city){
        alert("Remplissez tous les champs");
        return;
    }
    // Génération code aléatoire 6 chiffres
    codeGenerated = Math.floor(100000 + Math.random()*900000);
    pendingClient = {name, phone, city};
    
    // Affiche le code comme si envoyé par SMS
    alert(`✅ Code envoyé sur votre numéro ${phone}\n(Code pour test : ${codeGenerated})`);
    
    // Masque modal création compte, ouvre modal vérification
    document.getElementById("authModal").style.display="none";
    document.getElementById("verifyModal").style.display="flex";
}

// Vérification code
function verifyCode(){
    const code = document.getElementById("smsCode").value.trim();
    if(code == codeGenerated){
        client = pendingClient;
        localStorage.setItem("clientZIONA", JSON.stringify(client)); // garde actif
        document.getElementById("verifyModal").style.display="none";
        alert("✅ Compte validé ! Bienvenue "+client.name);
    } else {
        alert("❌ Code incorrect, réessayez");
    }
}

// ----------------- ESPACE CLIENT -----------------
function openAccount(){
    if(!client){alert("Veuillez créer un compte"); return;}
    document.getElementById("accountModal").style.display="flex";
    document.getElementById("accName").innerText = client.name;
    document.getElementById("accPhone").innerText = client.phone;
    document.getElementById("accCity").innerText = client.city;
    updateOrdersList();
}
function closeAccount(){document.getElementById("accountModal").style.display="none";}
function logout(){localStorage.removeItem("clientZIONA"); client=null; alert("Vous êtes déconnecté"); location.reload();}

// ----------------- PRODUITS -----------------
const products=[
{name:'T-shirt Blanc',price:15000,category:'tshirt',img:'https://via.placeholder.com/300x300?text=T-shirt+Blanc',details:'Taille: S/M/L, 100% coton'},
{name:'T-shirt Noir',price:16000,category:'tshirt',img:'https://via.placeholder.com/300x300?text=T-shirt+Noir',details:'Taille: S/M/L, 100% coton'},

{name:'Casquette Noire',price:10000,category:'casquette',img:'https://via.placeholder.com/300x300?text=Casquette+Noire',details:'Taille unique'},
{name:'Casquette Blanche',price:10500,category:'casquette',img:'https://via.placeholder.com/300x300?text=Casquette+Blanche',details:'Taille unique'},
{name:'Chaussettes Courtes',price:5000,category:'chaussettes',img:'https://via.placeholder.com/300x300?text=Chaussettes+Courtes',details:'Pack de 3'},
{name:'Chaussettes Longues',price:6000,category:'chaussettes',img:'https://via.placeholder.com/300x300?text=Chaussettes+Longues',details:'Pack de 3'},

{name:'T-shirt Bleu',price:15500,category:'tshirt',img:'https://via.placeholder.com/300x300?text=T-shirt+Bleu',details:'Taille: S/M/L'},
{name:'Hoodie Rouge',price:31000,category:'hoodie',img:'https://via.placeholder.com/300x300?text=Hoodie+Rouge',details:'Taille: M/L'},

];

let cart=[];
function displayProducts(category='all'){
  const list=document.getElementById('product-list');
  list.innerHTML='';
  products.forEach(p=>{
    if(category==='all'||p.category===category){
      const div=document.createElement('div');
      div.className='product';
      div.innerHTML=`<img src="${p.img}" alt="${p.name}">
        <h3>${p.name}</h3>
        <div class="details">${p.details}</div>
        <p>FCFA ${p.price}</p>
        <button class="add" onclick="addToCart('${p.name}',${p.price})">Ajouter au panier</button>`;
      list.appendChild(div);
    }
  });
}
function filterCategory(cat){displayProducts(cat);}
displayProducts();

function addToCart(name,price){
  if(!client){alert("Veuillez créer un compte");return;}
  cart.push({name,price});
  updateCart();
}
function removeFromCart(i){cart.splice(i,1);updateCart();}
function updateCart(){
  const items=document.getElementById('cartContent');
  const totalSpan=document.getElementById('cart-total');
  items.innerHTML='';
  let total=0;
  cart.forEach((item,i)=>{
    total+=item.price;
    const div=document.createElement('div');
    div.className='cart-item';
    div.innerHTML=`${item.name} - FCFA ${item.price} <button onclick="removeFromCart(${i})">X</button>`;
    items.appendChild(div);
  });
  totalSpan.innerText=total;
  document.querySelector('.cart').innerText=`🛒 Panier (${cart.length})`;
}
function toggleCart(){const c=document.getElementById('cart');c.style.display=(c.style.display==='none'?'flex':'none');}

// Paiement OM simulé
function payOM(){
  if(!client){alert("Veuillez créer un compte");return;}
  if(cart.length===0){alert("Votre panier est vide");return;}
  const delivery = document.getElementById("deliveryMode").value;
  let total = cart.reduce((s,i)=>s+i.price,0);
  if(delivery==="express") total+=2000;
  let productsList = cart.map(i=>i.name).join(", ");
  alert(`✅ Paiement Orange Money simulé\nMontant : FCFA ${total}\nProduits : ${productsList}\nClient : ${client.name}`);
  // Sauvegarde commande
  orders.push({products:productsList,total,delivery});
  localStorage.setItem("ordersZIONA",JSON.stringify(orders));
  cart=[];updateCart();
}

// Historique commandes
function updateOrdersList(){
  const div = document.getElementById("ordersList");
  if(orders.length===0){div.innerHTML="Aucune commande pour le moment";}
  else{div.innerHTML="";orders.forEach((o,i)=>{
    const p=document.createElement("p");
    p.innerText=`${i+1}. ${o.products} - FCFA ${o.total} - ${o.delivery}`;
    div.appendChild(p);
  });}
}
</script>
