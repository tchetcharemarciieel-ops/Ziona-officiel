<h2>Boutique J</h2>
<div class="products">
  <div class="product">
    <img src="images/tshirt1.png" alt="T-shirt Blanc">
    <h3>T-shirt Blanc</h3>
    <p>€25</p>
    <button onclick="addToCart('T-shirt Blanc', 25)">Ajouter au panier</button>
  </div>
  <div class="product">
    <img src="images/tshirt2.png" alt="T-shirt Noir">
    <h3>T-shirt Noir</h3>
    <p>€25</p>
    <button onclick="addToCart('T-shirt Noir', 25)">Ajouter au panier</button>
  </div>
  <div class="product">
    <img src="images/cap.png" alt="Casquette">
    <h3>Casquette</h3>
    <p>€15</p>
    <button onclick="addToCart('Casquette', 15)">Ajouter au panier</button>
  </div>
</div>

<div id="cart">
  <h2>Panier</h2>
  <div id="cart-items"></div>
  <p>Total : €<span id="cart-total">0</span></p>
</div>

<script>
  let cart = [];
  function addToCart(name, price) { cart.push({name, price}); updateCart(); }
  function removeFromCart(index) { cart.splice(index,1); updateCart(); }
  function updateCart() {
    const cartItems = document.getElementById('cart-items');
    const cartTotal = document.getElementById('cart-total');
    cartItems.innerHTML = '';
    let total=0;
    cart.forEach((item,index)=>{
      total+=item.price;
      const div=document.createElement('div');
      div.className='cart-item';
      div.innerHTML=`${item.name} - €${item.price} <button onclick="removeFromCart(${index})">X</button>`;
      cartItems.appendChild(div);
    });
    cartTotal.innerText=total;
  }
</script>
